name: Проверки

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: README собран из актуальной базы
        run: python3 scripts/build_readme.py --check
      - name: Конфиги и база валидны
        run: python3 scripts/validate.py
