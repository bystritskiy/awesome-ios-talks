name: Проверки

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: README собран из актуальной базы
        run: python3 scripts/build_readme.py --check
      - name: Конфиги и база валидны
        run: python3 scripts/validate.py
